<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fecha Actual España</title>
</head>
<body>    
    <div id="fechaActual" style="font-size: 24px; margin: 20px;"></div>
    
    <script>
        function obtenerFechaEspaña() {
            var ahora = new Date();
            
            // Ajustar a la zona horaria de España (UTC+1 o UTC+2)
            // Nota: Esto es una aproximación ya que el WebBrowser antiguo no soporta timeZone
            var offsetEspaña = ahora.getTimezoneOffset() + 60; // Aprox. +1 hora
            ahora.setMinutes(ahora.getMinutes() + offsetEspaña);
            
            // Obtener componentes de la fecha
            var dia = ('0' + ahora.getDate()).slice(-2);
            var mes = ('0' + (ahora.getMonth() + 1)).slice(-2);
            var año = ahora.getFullYear();
            
            // Formatear como dd-mm-yyyy
            return dia + '-' + mes + '-' + año;
        }
        
        // Mostrar la fecha al cargar la página
        window.onload = function() {
            var fechaEspaña = obtenerFechaEspaña();
            document.getElementById('fechaActual').textContent = fechaEspaña;
        };
    </script>
</body>
</html>
